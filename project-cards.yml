# Project cards displayed on the homepage.
# List order determines section order (first-seen project_type) and card
# order within a section. Each distinct project_type is shown as a section heading.
# Omit icon for a text-only card.
# Optional companion names another card by name. It is drawn as a second
# section inside this card (without its icon) and is not shown on its own.

- name: CloudScope
  companion: CloudScope-Web
  description: Image analysis for microscopy data with desktop, web, and scripting. Uses reproducible **AcqStore** analysis engine and produces datasets that are visualized on the web with **CloudScope-Web**
  icon: cloudscope-icon.png
  project_type: Software Projects
  links:
    - type: live
      label: Web App
      url: https://cloudscope.mapmanager.net/
    - type: docs
      label: Docs
      url: https://mapmanager.github.io/cloudscope-app/

- name: CloudScope-Web
  description: Website to view published **CloudScope** datasets.
  icon: cloudscope-web.png
  project_type: Software Projects
  links:
    - type: live
      label: Web App
      url: https://mapmanager.github.io/cloudscope-web
    - type: github
      label: GitHub
      url: https://github.com/mapmanager/cloudscope-web
    - type: docs
      label: Docs
      url: https://mapmanager.github.io/cloudscope-web/docs/

