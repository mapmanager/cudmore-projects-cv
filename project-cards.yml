# Project cards displayed on the homepage.
# List order determines card order. Omit icon for a text-only card.

- name: Cloudscope
  description: Image analysis for microscopy data with desktop, web, and scripting. Specialized for line scan kymograph analysis of blood flow and diameter.
  icon: cloudscope-icon.png
  links:
    - type: live
      label: Web Demo
      url: https://cloudscope.mapmanager.net/
    - type: docs
      label: Docs
      url: https://mapmanager.github.io/cloudscope-app/

- name: SanPy
